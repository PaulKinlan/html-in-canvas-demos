<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>Timer</header>
<main>
  <div class="big" id="time">00:00</div>
  <div class="row"><button class="primary" id="go">Start</button><button id="clear">Reset</button></div>
  <p>The time is sent to the other pages. Each one shows it in its footer.</p>
</main>
<footer>&nbsp;</footer>
<script type="module">
import { state, share, channel } from './app.js';
let seconds = 0, id = 0;
const time = document.getElementById('time'), go = document.getElementById('go');
const show = () => { const t = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0'); time.textContent = t; document.title = id ? 'Timer ' + t : 'Timer'; share({ timer: t }); };
go.addEventListener('click', () => { if (id) { clearInterval(id); id = 0; } else id = setInterval(() => { seconds++; show(); }, 1000); go.textContent = id ? 'Stop' : 'Start'; show(); });
document.getElementById('clear').addEventListener('click', () => { seconds = 0; show(); });
</script>
</body>
</html>
