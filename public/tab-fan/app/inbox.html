<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>Inbox</header>
<main>
  <label class="item"><input type="checkbox"><span>Review the fold animation</span></label>
  <label class="item"><input type="checkbox"><span>Reply to Dana about the table</span></label>
  <label class="item"><input type="checkbox"><span>Book the test phone</span></label>
  <label class="item"><input type="checkbox" checked><span>Merge the minimap</span></label>
</main>
<footer>&nbsp;</footer>
<script type="module">
import { state, share, channel } from './app.js';
const boxes = [...document.querySelectorAll('input')];
const count = () => share({ unread: boxes.filter((b) => !b.checked).length });
document.querySelector('main').addEventListener('change', count);
document.addEventListener('appstate', () => { document.title = 'Inbox (' + state.unread + ')'; });
</script>
</body>
</html>
