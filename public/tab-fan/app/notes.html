<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>Notes</header>
<main>
  <textarea aria-label="Note">Cards in the fan are the real pages. Type here.</textarea>
  <div id="count"></div>
</main>
<footer>&nbsp;</footer>
<script type="module">
import { state, share, channel } from './app.js';
const area = document.querySelector('textarea'), out = document.getElementById('count');
const show = () => { out.textContent = area.value.length + ' characters'; };
area.addEventListener('input', show); show();
</script>
</body>
</html>
