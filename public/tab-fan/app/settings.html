<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>Settings</header>
<main>
  <p>Accent colour, for every page of the app:</p>
  <div class="row">
    <button class="swatch" style="background:#d2491f" data-c="#d2491f" aria-label="Orange"></button>
    <button class="swatch" style="background:#2a7de1" data-c="#2a7de1" aria-label="Blue"></button>
    <button class="swatch" style="background:#1f8a5b" data-c="#1f8a5b" aria-label="Green"></button>
    <button class="swatch" style="background:#8a3fd1" data-c="#8a3fd1" aria-label="Purple"></button>
  </div>
  <label>Name <input type="text" value="Sam" size="10"></label>
</main>
<footer>&nbsp;</footer>
<script type="module">
import { state, share, channel } from './app.js';
document.querySelector('.row').addEventListener('click', (e) => { const c = e.target.dataset.c; if (c) share({ accent: c }); });
</script>
</body>
</html>
