<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toolkit-occlusion fixture</title>
<link rel="stylesheet" href="/toolkit-occlusion/ui.css">
<body style="margin:0;background:#111">
<!-- The same app as /toolkit-occlusion/, alone on a page. The live checks load it in a frame
     so they never touch or focus the copy a person is using. -->
<div class="occ-stage" id="stage" style="border-radius:0">
    <canvas id="occlusion-app" content="drawable" layoutsubtree aria-label="Dear ImGui app: a form and two windows">
      <input data-occ="name" type="text" aria-label="Name" value="An input">
      <textarea data-occ="notes" rows="3" aria-label="Notes">A textarea. Drag a window over part of it.</textarea>
      <select data-occ="country" aria-label="Country"><option>United Kingdom</option><option>Japan</option><option>Brazil</option><option>Kenya</option></select>
      <p data-occ="terms">A paragraph with <a href="/imgui-dom/">a link to the first ImGui page</a> in it.</p>
      <div data-occ-blocker drawable></div>
      <div data-occ-blocker drawable></div>
    </canvas>
    <div data-occ-overlay hidden></div>
    <div data-occ-overlay hidden></div>
</div>
<script type="module">
import { startToolkitOcclusion } from '/toolkit-occlusion/start.js';
try { window.__app = await startToolkitOcclusion(document.getElementById('occlusion-app'), document.getElementById('stage')); } catch (err) { window.__error = err.message; }
</script>
</body>
</html>
