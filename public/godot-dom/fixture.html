<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>godot-dom fixture</title>
<link rel="stylesheet" href="/godot-dom/ui.css">
<body style="margin:0;background:#111">
<!-- The same app as /godot-dom/, alone on a page. The live checks load it in a frame
     so they never touch the copy a person is using. ?route=gl|hook|pixels picks the route. -->
<div class="gd-stage" style="height:100vh;min-height:0;border:0;border-radius:0">
<canvas id="godot" content="drawable" layoutsubtree tabindex="-1">
  <form class="gd-form" id="form" drawable autocomplete="off" novalidate>
    <div class="band">Sign in</div>
    <label>Email <input name="email" type="email" inputmode="email" placeholder="you@example.com"></label>
    <label>Password <input name="password" type="password"></label>
    <button type="submit">Sign in</button>
    <div data-log aria-live="polite"><div>form: not signed in</div></div>
    <div class="chat">
      <label>Chat <textarea name="chat" rows="2" placeholder="Say something"></textarea></label>
      <button type="button" data-send>Send</button>
    </div>
  </form>
</canvas>
</div>
<script type="module">
import { startGodot } from '/godot-dom/bridge.js';
const canvas = document.getElementById('godot');
const params = new URLSearchParams(location.search);
// Godot's mousedown handler focuses the canvas. Inside a frame that would take focus from
// the page that runs the checks, so the fixture's canvas cannot be focused by script.
// ?focus=1 leaves focus() alone, for tests that open this file as the top page.
if (!params.has('focus')) canvas.focus = () => {};
try {
  window.__godot = await startGodot({
    canvas,
    form: document.getElementById('form'),
    route: params.get('route') || 'gl',
    stopEvents: !params.has('bubble'), // ?bubble=1 measures Godot without the event guard
    onLost: () => { window.__lost = true; },
  });
} catch (err) {
  window.__failed = `${err?.name ?? 'Error'}: ${err?.message ?? err}`;
}
</script>
</body>
</html>
