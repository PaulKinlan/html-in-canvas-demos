<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>A slot in a canvas, with declarative shadow DOM</title>
<style>
  body { margin: 16px; font: 15px/1.5 system-ui; }
  #host { display: block; }
  #host > [slot] { width: 240px; padding: 12px 14px; border-radius: 10px; border: 1px solid #8886; box-sizing: border-box; }
  #host > [slot=first] { background: #fff4d6; color: #2c2205; }
  #host > [slot=second] { background: #e3f1ff; color: #08233f; }
  button, input { font: inherit; max-width: 100%; }
</style>
</head>
<body>

<div id="host">
  <!-- Because of shadowrootmode, the HTML parser does not keep this as a
       <template>. It attaches a shadow root to #host and puts the canvas
       straight into it, live. No script is involved in that. -->
  <template shadowrootmode="open">
    <canvas content="drawable" layoutsubtree style="display:block; width:100%; height:260px; border:1px solid #8886; border-radius:12px">
      <slot name="first"></slot>
      <slot name="second"></slot>
    </canvas>
  </template>

  <!-- Ordinary children of #host. slot="…" sends each one into the canvas. -->
  <section slot="first" drawable>
    <strong>slot="first"</strong><br>
    A normal child of a normal div. <button id="count" type="button">Clicked 0×</button>
  </section>
  <section slot="second" drawable>
    <strong>slot="second"</strong><br>
    <input placeholder="still an input">
  </section>
</div>

<script type="module">
  // 1. Find the canvas. The parser already built the shadow root.
  const host = document.getElementById('host');
  const canvas = host.shadowRoot.querySelector('canvas');
  const ctx = canvas.getContext('2d');

  // 2. Keep the canvas's pixel size equal to its size on screen, so it is sharp.
  new ResizeObserver(([entry]) => {
    const box = entry.devicePixelContentBoxSize[0];
    if (canvas.width !== box.inlineSize) canvas.width = box.inlineSize;
    if (canvas.height !== box.blockSize) canvas.height = box.blockSize;
    canvas.requestPaint();
  }).observe(canvas, { box: 'device-pixel-content-box' });

  // 3. Draw whatever is slotted. The browser fires "paint" when a drawn
  //    element changes (typing, hover, the button's label) and after requestPaint().
  canvas.onpaint = () => {
    const dpr = canvas.width / canvas.clientWidth;
    ctx.reset();
    ctx.scale(dpr, dpr); // from here on, draw in CSS pixels
    let x = 20, y = 30;
    for (const slot of canvas.querySelectorAll('slot')) {
      for (const el of slot.assignedElements()) {
        // Wrap to a new row when the canvas is narrow (phones).
        if (x > 20 && x + el.offsetWidth > canvas.clientWidth - 8) { x = 20; y += el.offsetHeight + 24; }
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(slot.name === 'first' ? -0.05 : 0.04);
        // Always pass a width and height. Where you draw is also where it can be clicked.
        ctx.drawElementImage(el, 0, 0, el.offsetWidth, el.offsetHeight);
        ctx.restore();
        x += el.offsetWidth + 24;
      }
    }
  };

  // 4. Repaint when elements are slotted in or taken out later.
  canvas.addEventListener('slotchange', () => canvas.requestPaint());

  // The page's own behaviour, nothing to do with the canvas.
  let n = 0;
  const count = document.getElementById('count');
  count.onclick = () => (count.textContent = `Clicked ${++n}×`);
</script>
</body>
</html>
