<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>egui-dom fixture</title>
<link rel="stylesheet" href="/native-ui/ui.css">
<body style="margin:0;background:#111">
<!-- The same app as /native-ui/, alone on a page. The live checks load it in a frame
     so they never touch the copy a person is using. -->
<div class="egui-stage" style="height:100vh;min-height:0;border-radius:0">
<canvas id="app" content="drawable" layoutsubtree>
  <input data-egui="email" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email">
  <select data-egui="country" aria-label="Country"><option>United Kingdom</option><option>Japan</option><option>Brazil</option><option>Kenya</option></select>
  <input data-egui="birthday" type="date" aria-label="Date of birth">
  <textarea data-egui="about" rows="3" spellcheck="true" aria-label="About you">I liek canvas apps.</textarea>
  <p data-egui="terms">By signing up you agree to the <a href="/start/">terms</a>. This sentence is DOM text: مرحبا, 你好, 👋🏽.</p>
  <input data-egui="search" type="search" placeholder="Search" aria-label="Search">
</canvas>
</div>
<script type="module">
import init, { start } from '/native-ui/egui/egui_dom.js';
await init();
const focus = HTMLElement.prototype.focus;
HTMLElement.prototype.focus = function () {}; // eframe focuses its text input on start-up
const app = document.getElementById('app');
const rawAdd = app.addEventListener;
app.addEventListener = function (type, listener, options) {
  if ((type === 'touchstart' || type === 'touchmove') && listener) {
    const fn = typeof listener === 'function' ? listener : listener.handleEvent?.bind(listener);
    if (fn) {
      return rawAdd.call(this, type, function (e) {
        if (!e.cancelable) {
          Object.defineProperty(e, 'preventDefault', { value() {}, configurable: true });
          try { return fn.call(this, e); } finally { delete e.preventDefault; }
        }
        return fn.call(this, e);
      }, options);
    }
  }
  return rawAdd.call(this, type, listener, options);
};
try { await start(app); } finally { HTMLElement.prototype.focus = focus; }
window.__started = true;
</script>
</body>
</html>
