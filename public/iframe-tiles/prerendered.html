<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prerendered tiles (with the header)</title>
<link rel="stylesheet" href="/shared/style.css">
<style>canvas { display: block; border: 1px solid var(--line); border-radius: 8px; } pre { font: 12px/1.5 var(--mono); white-space: pre-wrap; }</style>
</head>
<body>
<main>
  <p><a href="/iframe-tiles/#prerender">Back to the iframe tiles page</a></p>
  <h1>Prerendered tiles: with the header</h1>
  <p>This page is sent with <code>Supports-Loading-Mode: prerender-cross-origin-frames</code>. A browser that supports it loads the cross-origin tile while the page is still being prerendered.</p>
  <canvas id="board" content="drawable" layoutsubtree></canvas>
  <table class="results"><thead><tr><th>What</th><th>When</th></tr></thead><tbody id="out"><tr><td>Measuring</td><td>…</td></tr></tbody></table>
  <pre id="log"></pre>
</main>
<script type="module" src="/iframe-tiles/prerendered.js"></script>
</body>
</html>
