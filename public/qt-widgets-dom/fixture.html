<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qt-widgets-dom fixture</title>
<link rel="stylesheet" href="/qt-widgets-dom/ui.css">
<body style="margin:0;background:#111">
<!-- The same app as /qt-widgets-dom/, alone on a page, for the live checks and for testing. -->
<div class="qtw-stage" style="border-radius:0;max-width:none;height:100vh">
  <div class="qtw-screen" id="screen"></div>
    <!-- Qt creates its own canvas, so the elements start outside it. DomWidget moves each one in. -->
    <div class="qtw-parts">
      <input class="qtw-dom" data-qtw="email" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email">
      <select class="qtw-dom" data-qtw="plan" aria-label="Plan"><option>Free</option><option>Team</option><option>Enterprise</option></select>
      <textarea class="qtw-dom" data-qtw="notes" rows="3" aria-label="Notes">A real textarea inside a Qt Widgets window.</textarea>
      <p class="qtw-dom" data-qtw="terms">DOM text with a <a href="/start/">link</a>: مرحبا, 你好, 👋🏽.</p>
    </div>
</div>
<script type="module">
import { startQtWidgets } from '/qt-widgets-dom/start.js';
try { window.__app = await startQtWidgets(document.getElementById('screen'), { onExit: (e) => (window.__exit = e) }); window.__started = true; } catch (err) { window.__error = String(err.message ?? err); }
</script>
</body>
</html>
