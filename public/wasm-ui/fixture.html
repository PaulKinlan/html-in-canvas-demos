<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wasm-ui fixture</title>
<link rel="stylesheet" href="/wasm-ui/ui.css">
<body style="margin:0;background:#111">
<!-- The same program as /wasm-ui/, alone on a page. The live checks load it in a frame
     so they never touch the copy a person is using. -->
<div class="ui-stage" style="border-radius:0">
    <canvas id="app" content="drawable" layoutsubtree aria-label="Project settings, drawn by a WebAssembly program">
      <h3 data-ui="title" drawable>Project settings</h3>
      <label data-ui="name-label" drawable for="ui-name">Name</label>
      <input data-ui="name" drawable id="ui-name" value="Demo project" autocomplete="off">
      <textarea data-ui="notes" drawable rows="3" aria-label="Notes">These two fields are real elements. The slider and the Delete button are drawn by the C program.</textarea>
      <p data-ui="fade-label" drawable>Opacity of the two fields: <output>100</output>%</p>
      <span data-ui="delete-label" drawable>Delete project…</span>
      <p data-ui="status" drawable data-words="ask() is running.|ask() has not been called.|ask() returned 0: Cancel.|ask() returned 1: Delete.">C says: <output>ask() has not been called.</output></p>
      <div data-ui="dialog" drawable role="dialog" aria-modal="true" aria-labelledby="ui-question">
        <p id="ui-question">Delete this project? The C function ask() does not return until you choose.</p>
        <div>
          <button type="button" data-ui="dialog-ok">Delete</button>
          <button type="button" data-ui="dialog-cancel" data-first>Cancel</button>
        </div>
      </div>
    </canvas>
</div>
<script type="module">
import { startToolkit } from '/wasm-ui/ui.js';
try {
  window.__ui = await startToolkit(document.getElementById('app'), { onStop: (why) => (window.__stopped = why) });
} catch (err) {
  window.__error = err.message;
}
</script>
</body>
</html>
