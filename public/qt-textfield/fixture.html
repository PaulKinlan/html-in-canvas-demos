<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qt-textfield fixture</title>
<link rel="stylesheet" href="/qt-textfield/ui.css">
<body style="margin:0;background:#111">
<!-- The same app as /qt-textfield/, alone on a page, for the live checks and for testing.
     With ?nofocus the frame records focus() calls instead of running them, so that a check
     can read what Qt would focus without moving focus on the page that holds the frame. -->
<div class="qtf-stage" style="border-radius:0;max-width:none;height:100vh">
  <div class="qtf-screen" id="screen"></div>
  <div class="qtf-parts">
    <input data-qt="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" aria-label="Email" autocapitalize="none" spellcheck="false">
    <input data-qt="password" type="password" name="password" autocomplete="current-password" placeholder="password" aria-label="Password">
    <input data-qt="code" type="text" name="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" placeholder="123456" aria-label="Code" enterkeyhint="done">
  </div>
</div>
<script type="module">
import { startQtTextField } from '/qt-textfield/start.js';
if (new URLSearchParams(location.search).has('nofocus')) {
  window.__focusCalls = [];
  HTMLElement.prototype.focus = function () { window.__focusCalls.push(this); };
}
try { window.__app = await startQtTextField(document.getElementById('screen'), { onExit: (e) => (window.__exit = e) }); window.__started = true; } catch (err) { window.__error = String(err.message ?? err); }
</script>
</body>
</html>
