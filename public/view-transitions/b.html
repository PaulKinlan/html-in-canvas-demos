<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document B</title>
<link rel="stylesheet" href="/shared/style.css">
<link rel="stylesheet" href="/view-transitions/doc.css">
<style>
  #lt { height: 260px; width: min(100%, 420px); margin-left: auto; }
</style>
</head>
<body>
<main>
  <p><a href="/view-transitions/">Back to the view transitions experiments</a></p>
  <h1>Document B</h1>
  <p class="note">This is one of two documents. The box below is a canvas with <code>view-transition-name: stage</code> on both. <span id="said" role="status"></span></p>
  <live-transition id="lt" bleed="0">
    <section class="state" style="background:#10242b;color:#e6f4f1">
      <h2>Canvas on document B</h2>
      <p>Narrower and taller, pushed to the right.</p>
      <span class="clock" data-clock></span>
      <input type="text" value="An input in the canvas" aria-label="Text in the canvas">
    </section>
  </live-transition>
  <script>
    // Before first paint: if the last page left a picture of its canvas, make it this element's first state.
    {
      const url = new URLSearchParams(location.search).has('shader') && sessionStorage.getItem('vt-handover');
      sessionStorage.removeItem('vt-handover');
      if (url) {
        const img = Object.assign(new Image(), { src: url, alt: '' });
        img.dataset.old = '';
        document.getElementById('lt').prepend(img);
        document.documentElement.classList.add('handover');
      }
      // pagereveal can fire before a module script has run, so listen here.
      addEventListener('pagereveal', (e) => {
        window.__reveal = { viewTransition: !!e.viewTransition, handover: !!url };
        document.getElementById('said').textContent = e.viewTransition
          ? 'This page arrived with a view transition.'
          : 'This page arrived without a view transition (first load, reload, or the browser has none).';
      });
    }
  </script>
  <p><a data-next="/view-transitions/a.html" href="/view-transitions/a.html">Go to document A</a></p>
</main>
<script type="module" src="/view-transitions/doc.js"></script>
</body>
</html>
