<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>canvas-slot: the smallest page</title>

<style>
  body { font: 16px/1.5 system-ui; margin: 16px; }
  #hero { display: block; height: 260px; border: 1px solid #8886; border-radius: 12px; }
  #hero > * { box-sizing: border-box; width: min(280px, 80%); padding: 12px 14px; border-radius: 10px; }
  article { background: #fff7e6; color: #2a2116; }
  form { background: #e9f3ff; color: #10243d; }
</style>

<script type="module" src="/lib/canvas-slot.js"></script>

<!-- Children with a slot="…" name are drawn into the canvas. They stay real
     DOM: you can select the text, tab to the input, type and click. -->
<canvas-slot id="hero">
  <article slot="note">
    <strong>Real DOM</strong><br>
    This card is ordinary HTML, drawn by a canvas.
  </article>
  <form slot="form">
    <label>Still a form <input placeholder="Type here…" size="12"></label>
    <button type="button" id="count">Clicked 0×</button>
  </form>
</canvas-slot>

<script type="module">
  const hero = document.getElementById('hero');     // the <canvas-slot>

  // Called on every paint. ctx is the canvas's 2D context.
  // draw(slotName, x, y) draws the element that is in that slot.
  // Each card keeps a fixed tilt while bobbing: changing ctx.rotate() by a new
  // angle every frame drops text lines on Chromium's Metal GPU glyph atlas.
  hero.onrender = ({ ctx, draw, time }) => {
    const bob = Math.sin(time / 900) * 6;
    ctx.save();
    ctx.rotate(-0.025);
    draw('note', 20, 20 + bob);
    ctx.restore();
    ctx.save();
    ctx.rotate(0.02);
    draw('form', 40, 128 - bob);
    ctx.restore();
  };
  hero.animate = true;                              // repaint every frame

  let clicks = 0;
  const button = document.getElementById('count');
  button.onclick = () => (button.textContent = `Clicked ${++clicks}×`);
</script>
</html>
