<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>canvas-slot: content from outside the element</title>

<style>
  body { font: 16px/1.5 system-ui; margin: 16px; }
  #stage { display: block; height: 120px; border: 1px solid #8886; border-radius: 12px; }
  /* Style by id or class. A rule like "footer > aside" would stop matching
     while the element is in the canvas, because its parent changes. */
  #promo { box-sizing: border-box; width: min(280px, 100%); padding: 10px 14px; border-radius: 10px; background: #efe6ff; color: #23104a; }
</style>

<script type="module" src="/lib/canvas-slot.js"></script>

<!-- from="…" is a CSS selector. Whatever matches, anywhere in the page, is
     brought into this canvas. Its slot name is its id ("promo"). -->
<canvas-slot id="stage" from="#promo"></canvas-slot>

<p>Some page content between the canvas and the element.</p>

<footer>
  <aside id="promo">
    I am written in the footer. <button type="button" id="count">Clicked 0×</button>
  </aside>
</footer>

<p><button type="button" id="toggle">Put it back in the footer</button></p>

<script type="module">
  const stage = document.getElementById('stage');   // the <canvas-slot>
  const promo = document.getElementById('promo');   // the outside element

  stage.onrender = ({ draw }) => draw('promo', 16, 16);

  // release() puts it back exactly where it was. adopt() brings it in again.
  const toggle = document.getElementById('toggle');
  toggle.onclick = () => {
    if (stage.adopted.includes(promo)) {
      stage.release(promo);
      toggle.textContent = 'Bring it into the canvas';
    } else {
      stage.adopt(promo);
      toggle.textContent = 'Put it back in the footer';
    }
  };

  let clicks = 0;
  const button = document.getElementById('count');
  button.onclick = () => (button.textContent = `Clicked ${++clicks}×`);
</script>
</html>
