<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imgui-dom fixture</title>
<link rel="stylesheet" href="/imgui-dom/ui.css">
<body style="margin:0;background:#111">
<!-- The same app as /imgui-dom/, alone on a page. The live checks load it in a frame
     so they never touch the copy a person is using. -->
<div class="imgui-stage" style="border-radius:0">
    <canvas id="imgui-app" content="drawable" layoutsubtree tabindex="0" aria-label="Dear ImGui app: an account form">
      <input data-imgui="email" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email">
      <select data-imgui="country" aria-label="Country"><option>United Kingdom</option><option>Japan</option><option>Brazil</option><option>Kenya</option></select>
      <input data-imgui="birthday" type="date" aria-label="Date of birth">
      <textarea data-imgui="about" rows="3" aria-label="About you">A real textarea. The phone keyboard, selection and IME are the browser's.</textarea>
      <p data-imgui="terms">DOM text with a <a href="/start/">link</a>: مرحبا, 你好, 👋🏽.</p>
    </canvas>
</div>
<script type="module">
import { startImgui } from '/imgui-dom/start.js';
try { window.__app = await startImgui(document.getElementById('imgui-app')); } catch (err) { window.__error = err.message; }
</script>
</body>
</html>
