<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live card</title>
<style>
  /* The card decides what a host may restyle: these custom properties and nothing else. */
  :root { --card-bg: #ffffff; --card-fg: #1d1c1a; --card-accent: #d2491f; --card-radius: 16px; --card-font: system-ui, sans-serif; }
  html, body { margin: 0; background: transparent; }
  .card { container-type: inline-size; font: 15px/1.45 var(--card-font); color: var(--card-fg); background: var(--card-bg); border-radius: var(--card-radius); border: 1px solid color-mix(in srgb, var(--card-fg) 18%, transparent); padding: 16px; }
  .layout { display: grid; gap: 14px; }
  @container (min-width: 420px) { .layout { grid-template-columns: 130px 1fr; align-items: start; } }
  .art { aspect-ratio: 1; border-radius: calc(var(--card-radius) * 0.6); background: conic-gradient(from 210deg, var(--card-accent), color-mix(in srgb, var(--card-accent) 30%, var(--card-bg)), var(--card-accent)); display: grid; place-items: center; font-size: 44px; max-height: 150px; }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .by { font-size: 12px; opacity: 0.65; margin: 0 0 8px; }
  .price { font: 700 22px/1 ui-monospace, monospace; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  button, input { font: inherit; color: inherit; }
  button { border: 1px solid color-mix(in srgb, var(--card-fg) 35%, transparent); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  button.primary { background: var(--card-accent); border-color: var(--card-accent); color: #fff; font-weight: 600; }
  button.step { width: 32px; padding: 5px 0; }
  output { min-width: 2ch; text-align: center; font-weight: 600; }
  input[type=text] { flex: 1; min-width: 120px; padding: 5px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--card-fg) 35%, transparent); background: color-mix(in srgb, var(--card-fg) 4%, var(--card-bg)); }
  :focus-visible { outline: 2px solid var(--card-accent); outline-offset: 2px; }
  #basket { font-size: 13px; opacity: 0.75; min-height: 1.4em; }
</style>
</head>
<body>
<live-region id="region">
  <article class="card">
    <div class="layout">
      <div class="art" aria-hidden="true">☕</div>
      <div>
        <h1>Single-origin filter coffee</h1>
        <p class="by">Sold by <span id="seller"></span></p>
        <p class="price">£<span id="total">9.50</span></p>
        <div class="row">
          <button class="step" id="less" type="button" aria-label="One fewer">−</button>
          <output id="qty" aria-label="Quantity">1</output>
          <button class="step" id="more" type="button" aria-label="One more">+</button>
          <button class="primary" id="add" type="button">Add to basket</button>
          <button id="like" type="button" aria-pressed="false">♡ Save</button>
        </div>
        <div class="row"><input type="text" id="note" placeholder="Gift note" aria-label="Gift note" autocomplete="off"></div>
        <div id="basket" role="status">Basket is empty.</div>
      </div>
    </div>
  </article>
</live-region>
<script type="module">
  // An embeddable card. Its DOM never leaves this document. A host that
  // embeds it gets three things, all by postMessage:
  //   pixels      ImageBitmaps of the card, to draw however it likes
  //   input       the host sends pointer/key messages; they are replayed here
  //   a contract  the host may set the --card-* properties above, nothing else
  import { serve, supported } from '/lib/live-surface.js';
  import { portLink } from '/lib/live-view.js';

  const $ = (id) => document.getElementById(id);
  $('seller').textContent = location.host;
  let qty = 1;
  let basket = 0;
  let liked = false;
  let link = null;
  const tell = () => link?.send({ t: 'app', basket, liked, note: $('note').value });
  const show = () => {
    $('qty').value = qty;
    $('total').textContent = (qty * 9.5).toFixed(2);
    $('basket').textContent = basket ? `${basket} bag${basket > 1 ? 's' : ''} in your basket.` : 'Basket is empty.';
    $('like').textContent = liked ? '♥ Saved' : '♡ Save';
    $('like').setAttribute('aria-pressed', liked);
    tell();
  };
  $('less').onclick = () => ((qty = Math.max(1, qty - 1)), show());
  $('more').onclick = () => ((qty = Math.min(9, qty + 1)), show());
  $('add').onclick = () => ((basket += qty), show());
  $('like').onclick = () => ((liked = !liked), show());
  $('note').oninput = tell;

  const THEMEABLE = { '--card-bg': /^#[0-9a-f]{3,8}$/i, '--card-fg': /^#[0-9a-f]{3,8}$/i, '--card-accent': /^#[0-9a-f]{3,8}$/i, '--card-radius': /^\d{1,2}px$/, '--card-font': /^[\w ,'"-]{1,80}$/ };
  const surface = $('region').surface;
  if (surface) surface.opaque = false; // keep the rounded corners transparent for the host

  // Demo only: any page may embed this card.
  addEventListener('message', (e) => {
    if (e.source !== parent) return;
    const m = e.data;
    if (m?.type === 'live-port' && e.ports[0]) {
      if (!surface) return parent.postMessage({ type: 'card-unsupported' }, '*');
      link = portLink(e.ports[0]);
      serve(surface, link, { title: 'Live card', peer: e.origin });
    } else if (m?.type === 'theme' && m.vars && typeof m.vars === 'object') {
      for (const [name, value] of Object.entries(m.vars)) {
        if (THEMEABLE[name]?.test(String(value))) document.documentElement.style.setProperty(name, value);
      }
    }
  });
  parent.postMessage({ type: 'card-ready', supported }, '*');
</script>
</body>
</html>
