<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toolkit-aria fixture</title>
<link rel="stylesheet" href="/toolkit-aria/ui.css">
<body style="margin:0;background:#111">
<!-- The same app as /toolkit-aria/, alone on a page. The live checks load it in a frame
     so they never touch or focus the copy a person is using. -->
<div class="aria-stage" style="border-radius:0">
    <canvas id="aria-app" content="drawable" layoutsubtree role="group" aria-label="Document settings, drawn by Dear ImGui"></canvas>
</div>
<script type="module">
import { startToolkitAria } from '/toolkit-aria/start.js';
try { window.__app = await startToolkitAria(document.getElementById('aria-app')); } catch (err) { window.__error = err.message; }
</script>
</body>
</html>
