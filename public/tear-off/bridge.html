<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget from another origin</title>
<style>
  body { margin: 0; font: 13px system-ui; background: #1c1b22; color: #ddd; }
  p { margin: 0; padding: 6px 10px; background: #000; color: #9f9; font: 11px ui-monospace, monospace; }
  iframe { display: block; width: 100%; height: calc(100vh - 28px); border: 0; background: #fff; }
</style>
</head>
<body>
<p id="who"></p>
<iframe id="f" title="Bridge to the widget's origin"></iframe>
<script>
  // A page on one origin that wants a widget from an unrelated tab on another
  // origin, with no opener and no server. It embeds a frame from the widget's
  // origin; that frame can use BroadcastChannel to find the source tab,
  // unless the browser partitions it (cross-site embedding).
  const src = new URLSearchParams(location.search).get('src');
  let ok = false;
  try { ok = /^https?:$/.test(new URL(src).protocol); } catch {}
  document.getElementById('who').textContent = `this page: ${location.origin} · frame: ${ok ? new URL(src).origin : 'none'}`;
  if (ok) document.getElementById('f').src = src;
  // Let a test harness above us ask how many frames the bridge frame has seen.
  addEventListener('message', (e) => {
    if (e.source === document.getElementById('f').contentWindow) parent.postMessage(e.data, '*');
    else if (e.source === parent) document.getElementById('f').contentWindow.postMessage(e.data, '*');
  });
</script>
</body>
</html>
