<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sheet</title>
<link rel="stylesheet" href="tile.css">
<style>
  body { padding: 10px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; font: 13px ui-monospace, Menlo, monospace; }
  th { background: #f1ede4; color: #6b6760; font-weight: 500; width: 28px; }
  th, td { border: 1px solid #ddd8cf; height: 26px; padding: 0; text-align: center; }
  td input { width: 100%; height: 100%; border: 0; padding: 0 6px; background: transparent; font: inherit; text-align: right; }
  td input:focus { outline: 2px solid var(--accent); outline-offset: -2px; text-align: left; }
  p { font-size: 12px; color: #6b6760; margin: 8px 2px 0; }
</style>
<table id="grid"></table>
<p>Try <code>=A1+B1</code> or <code>=SUM(A1:A4)</code>. Focus a cell to see its formula.</p>
<script>
  const COLS = 'ABCD', ROWS = 6, KEY = 'board-sheet';
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null') || { A1: '120', B1: '80', C1: '=A1+B1', A2: '64', B2: '36', C2: '=A2+B2', A3: '9', B3: '12', C3: '=A3*B3', C5: '=SUM(C1:C3)', B5: 'total' };
  const grid = document.getElementById('grid');
  const cell = (id, seen = new Set()) => {
    const v = raw[id] ?? '';
    if (!v.startsWith('=')) return v === '' || isNaN(v) ? v : Number(v);
    if (seen.has(id)) return '#LOOP';
    seen.add(id);
    try {
      const expr = v.slice(1).toUpperCase()
        .replace(/SUM\(([A-D])(\d):([A-D])(\d)\)/g, (_, c1, r1, c2, r2) => {
          let total = 0;
          for (let c = COLS.indexOf(c1); c <= COLS.indexOf(c2); c++) for (let r = +r1; r <= +r2; r++) total += Number(cell(COLS[c] + r, new Set(seen))) || 0;
          return total;
        })
        .replace(/[A-D]\d/g, (ref) => Number(cell(ref, new Set(seen))) || 0);
      if (!/^[\d\s.+\-*/()]+$/.test(expr)) return '#ERR';
      return Math.round(Function(`"use strict";return (${expr})`)() * 1000) / 1000;
    } catch { return '#ERR'; }
  };
  grid.innerHTML = `<tr><th></th>${[...COLS].map((c) => `<th>${c}</th>`).join('')}</tr>` +
    Array.from({ length: ROWS }, (_, r) => `<tr><th>${r + 1}</th>${[...COLS].map((c) => `<td><input data-id="${c}${r + 1}" aria-label="${c}${r + 1}"></td>`).join('')}</tr>`).join('');
  const inputs = [...grid.querySelectorAll('input')];
  const show = () => inputs.forEach((i) => { if (document.activeElement !== i) i.value = cell(i.dataset.id); });
  for (const i of inputs) {
    i.onfocus = () => { i.value = raw[i.dataset.id] ?? ''; i.select(); };
    i.onblur = () => { raw[i.dataset.id] = i.value; localStorage.setItem(KEY, JSON.stringify(raw)); show(); };
    i.onkeydown = (e) => {
      if (e.key !== 'Enter') return;
      const next = inputs[inputs.indexOf(i) + COLS.length];
      (next ?? i).focus();
      if (!next) i.blur();
    };
  }
  show();
</script>
