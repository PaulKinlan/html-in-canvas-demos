<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sketch</title>
<link rel="stylesheet" href="tile.css">
<style>
  body { padding: 0; display: flex; flex-direction: column; }
  .bar { display: flex; gap: 6px; padding: 8px; align-items: center; border-bottom: 1px solid #e6e1d6; }
  .bar button { width: 24px; height: 24px; padding: 0; border-radius: 50%; }
  .bar button[aria-pressed=true] { outline: 2px solid #1d1c1a; outline-offset: 2px; }
  .bar .clear { width: auto; border-radius: 6px; padding: 2px 10px; margin-left: auto; }
  canvas { flex: 1; width: 100%; min-height: 0; touch-action: none; cursor: crosshair; background: #fffdf7; }
</style>
<div class="bar" id="bar"></div>
<canvas id="pad" aria-label="Sketch pad"></canvas>
<script>
  const pad = document.getElementById('pad'), ctx = pad.getContext('2d'), bar = document.getElementById('bar');
  let color = '#1d1c1a', last = null;
  for (const c of ['#1d1c1a', '#d2491f', '#1f7a3a', '#2a63c9']) {
    const b = document.createElement('button');
    b.style.background = c;
    b.setAttribute('aria-label', `Ink ${c}`);
    b.setAttribute('aria-pressed', String(c === color));
    b.onclick = () => { color = c; for (const o of bar.querySelectorAll('[aria-pressed]')) o.setAttribute('aria-pressed', String(o === b)); };
    bar.append(b);
  }
  const clear = Object.assign(document.createElement('button'), { className: 'clear', textContent: 'Clear' });
  clear.onclick = () => { ctx.clearRect(0, 0, pad.width, pad.height); hello(); };
  bar.append(clear);
  function hello() {
    ctx.strokeStyle = '#d2491f'; ctx.lineWidth = 3; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) { const x = 20 + i * 4, y = 60 + Math.sin(i / 5) * 22; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  new ResizeObserver(() => { pad.width = pad.clientWidth; pad.height = pad.clientHeight; hello(); }).observe(pad);
  const at = (e) => { const r = pad.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * pad.width, ((e.clientY - r.top) / r.height) * pad.height]; };
  pad.onpointerdown = (e) => { last = at(e); pad.setPointerCapture(e.pointerId); };
  pad.onpointermove = (e) => {
    if (!last) return;
    const p = at(e);
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke();
    last = p;
    window.strokes = (window.strokes || 0) + 1;
  };
  pad.onpointerup = pad.onpointercancel = () => (last = null);
</script>
