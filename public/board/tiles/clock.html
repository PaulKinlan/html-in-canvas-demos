<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Clock</title>
<link rel="stylesheet" href="tile.css">
<style>
  body { display: grid; place-items: center; background: #14161c; color: #eeebe5; padding: 0; }
  .face { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 3px solid #eeebe5; }
  .hand { position: absolute; left: 50%; bottom: 50%; width: 2px; margin-left: -1px; background: #eeebe5; transform-origin: 50% 100%; border-radius: 2px; }
  #h { height: 38px; width: 4px; margin-left: -2px; }
  #m { height: 58px; }
  #s { height: 64px; background: #ff7a4d; }
  time { display: block; text-align: center; font: 15px ui-monospace, Menlo, monospace; margin-top: 10px; }
</style>
<div>
  <div class="face" role="img" aria-label="Analogue clock"><i class="hand" id="h"></i><i class="hand" id="m"></i><i class="hand" id="s"></i></div>
  <time id="t"></time>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  function tick() {
    const d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    $('s').style.transform = `rotate(${s * 6}deg)`;
    $('m').style.transform = `rotate(${m * 6}deg)`;
    $('h').style.transform = `rotate(${h * 30}deg)`;
    $('t').textContent = d.toLocaleTimeString([], { hour12: false });
  }
  setInterval(tick, 250);
  tick();
</script>
