<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Markdown</title>
<link rel="stylesheet" href="tile.css">
<style>
  body { padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  textarea { border: 0; border-right: 1px solid #e6e1d6; padding: 12px; resize: none; font: 13px/1.5 ui-monospace, Menlo, monospace; background: #fbfaf6; min-width: 0; }
  textarea:focus { outline: 0; background: #fff; }
  #out { padding: 12px 14px; overflow: auto; font: 15px/1.5 Georgia, serif; }
  #out h2 { font: 700 18px/1.2 system-ui; margin: 0 0 8px; }
  #out p { margin: 0 0 8px; }
  #out ul { margin: 0 0 8px; padding-left: 20px; }
  #out code { font: 13px ui-monospace, monospace; background: #f1ede4; padding: 1px 4px; border-radius: 3px; }
</style>
<textarea id="src" aria-label="Markdown source" spellcheck="false"># Live preview

Type on the left. The right side is **real DOM** too.

- zoom with *ctrl + wheel*
- select this text
- `find-in-page` reaches it</textarea>
<div id="out" aria-live="polite"></div>
<script>
  const src = document.getElementById('src'), out = document.getElementById('out');
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/`(.+?)`/g, '<code>$1</code>');
  function render() {
    let html = '', list = false;
    for (const line of src.value.split('\n')) {
      const item = line.match(/^[-*] (.*)/);
      if (item) { html += (list ? '' : '<ul>') + `<li>${inline(item[1])}</li>`; list = true; continue; }
      if (list) { html += '</ul>'; list = false; }
      if (line.startsWith('#')) html += `<h2>${inline(line.replace(/^#+\s*/, ''))}</h2>`;
      else if (line.trim()) html += `<p>${inline(line)}</p>`;
    }
    out.innerHTML = html + (list ? '</ul>' : '');
  }
  src.oninput = render;
  render();
</script>
