<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>To-do</title>
<link rel="stylesheet" href="tile.css">
<style>
  form { display: flex; gap: 6px; margin-bottom: 10px; }
  form input { flex: 1; min-width: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #eee8dc; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #8a857c; }
  li button { padding: 0 7px; border: 0; background: none; color: #8a857c; }
  p { color: #6b6760; font-size: 13px; margin: 10px 0 0; }
</style>
<h1>To-do</h1>
<form id="f"><input id="t" type="text" placeholder="Add a task" aria-label="New task"><button>Add</button></form>
<ul id="list"></ul>
<p id="count"></p>
<script>
  const KEY = 'board-todo';
  let items = JSON.parse(localStorage.getItem(KEY) || 'null') || [
    { text: 'Put a document on an infinite canvas', done: true },
    { text: 'Zoom in until the text is huge', done: false },
    { text: 'Type in this box at 300%', done: false },
  ];
  const list = document.getElementById('list');
  function render() {
    list.replaceChildren(...items.map((item, i) => {
      const li = document.createElement('li');
      li.className = item.done ? 'done' : '';
      const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: item.done });
      box.setAttribute('aria-label', item.text);
      box.onchange = () => { item.done = box.checked; save(); };
      const span = Object.assign(document.createElement('span'), { textContent: item.text });
      const del = Object.assign(document.createElement('button'), { textContent: '×', title: 'Delete' });
      del.onclick = () => { items.splice(i, 1); save(); };
      li.append(box, span, del);
      return li;
    }));
    document.getElementById('count').textContent = `${items.filter((i) => !i.done).length} left of ${items.length}`;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(items)); render(); }
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const t = document.getElementById('t');
    if (t.value.trim()) items.push({ text: t.value.trim(), done: false });
    t.value = '';
    save();
  };
  render();
</script>
