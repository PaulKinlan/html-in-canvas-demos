<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>HTML-in-canvas: the smallest page</title>

<style>
  body { font: 16px/1.5 system-ui; margin: 16px; }
  canvas { display: block; width: 100%; height: 240px; border: 1px solid #8886; border-radius: 12px; }
  #card { box-sizing: border-box; width: min(280px, 80%); padding: 12px 14px; border-radius: 10px; background: #fff7e6; color: #2a2116; }
  button, input { font: inherit; max-width: 100%; }
</style>

<!-- 1. The canvas opts in, and the element to draw is its child.
        Each child you want to draw carries the "drawable" attribute. -->
<canvas id="canvas" content="drawable" layoutsubtree>
  <form id="card" drawable>
    <strong>Real DOM, drawn by a canvas</strong><br>
    <label>Type here <input size="10" placeholder="still an input"></label>
    <button type="button" id="count">Clicked 0×</button>
  </form>
</canvas>

<script type="module">
  const canvas = document.getElementById('canvas');
  const card = document.getElementById('card');
  const ctx = canvas.getContext('2d');

  // 2. Make the canvas as many pixels as it covers on screen, so text is sharp.
  new ResizeObserver(([entry]) => {
    const box = entry.devicePixelContentBoxSize[0];
    if (canvas.width !== box.inlineSize) canvas.width = box.inlineSize;
    if (canvas.height !== box.blockSize) canvas.height = box.blockSize;
    canvas.requestPaint();
  }).observe(canvas, { box: 'device-pixel-content-box' });

  // 3. The browser fires "paint" when a drawable child changes how it looks
  //    (typing, hover, focus ring, new text) and after requestPaint().
  canvas.onpaint = () => {
    const dpr = canvas.width / canvas.clientWidth;
    ctx.reset();
    ctx.scale(dpr, dpr);                 // from here on, draw in CSS pixels

    // Anything a 2D canvas can do applies to the element.
    ctx.translate(24, 30);
    ctx.rotate(-0.04);
    ctx.shadowColor = '#0004';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;

    // 4. Draw it. Always pass the width and height.
    //    The browser also moves the element's hit box to where you drew it,
    //    so clicks, focus and typing land on what you see.
    ctx.drawElementImage(card, 0, 0, card.offsetWidth, card.offsetHeight);
  };

  let clicks = 0;
  const button = document.getElementById('count');
  button.onclick = () => (button.textContent = `Clicked ${++clicks}×`);
</script>
</html>
